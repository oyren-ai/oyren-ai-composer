# oyren-sandbox tmux config (installed to /etc/tmux.conf, read by every `tmux` invocation —
# the entrypoint pre-launch AND server.js's attach).
#
# Everything here is here because this tmux is driven from a BROWSER terminal (xterm.js over a
# WebSocket), not a native one. A browser terminal keeps no scrollback that survives a full-screen
# TUI, has no X selection to fall back on, and on macOS offers no way to bypass mouse tracking. The
# defaults that are fine over ssh are not fine here — and anything not in THIS file does not exist,
# since a container is replaced without warning and $HOME goes with it.

# --------------------------------------------------------------- terminal contract
# Say what the outer terminal can do instead of letting it be inferred from $TERM. `bpaste` is the
# one that matters: without it tmux will not wrap a paste in ESC[200~/ESC[201~ for the pane, so a
# multi-line paste arrives as plain keystrokes and a shell runs every line but the last. xterm.js
# reports TERM=xterm-256color, from which tmux already infers bpaste — stating it keeps that true if
# the client ever reports something narrower.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:bpaste:clipboard:ccolour:cstyle:focus:title"

# How long tmux waits after an ESC to decide "lone Esc" vs "start of a sequence". The 500ms default
# makes Esc feel stuck in an editor and, worse, makes an ESC that arrives *inside* a paste ambiguous
# for half a second. A local pty has no reason to wait at all.
set -s escape-time 0

# Let the pane know when the browser tab gains/loses focus, and let an inner app's own escape
# sequences (Claude Code's OSC 52 among them) reach the terminal instead of being eaten by tmux.
set -g focus-events on
set -g allow-passthrough on

# Deep scrollback for long agent sessions — tmux owns the history when an app runs inside it, and the
# default of 2000 lines is minutes of output from a chatty coding agent.
set -g history-limit 100000

# tmux picks vi copy-mode keys when $EDITOR looks like vi, which it does in this image. Pin emacs so
# the copy-mode keys are the readline ones every shell user already has in their fingers.
setw -g mode-keys emacs

# ------------------------------------------------------------------ mouse + clipboard
# Bare tmux starts with mouse mode OFF, and then the browser wheel cannot reach tmux's history at all
# — you are stuck on the live screen of whatever TUI is running. That is why this is on.
#
# The cost is real: with mouse tracking on, tmux (or the TUI it forwards to) owns every click, so the
# browser's own selection is gone. On Linux/Windows xterm.js still lets shift-drag through; on macOS
# it does NOT — its bypass is option-drag gated behind `macOptionClickForcesSelection`, which the
# oyren-ai-next terminal does not set. So Mac users have no way back to a native selection except to
# turn the mouse off, which is what `prefix + m` is for.
set -g mouse on
bind m set -g mouse \; display-message "mouse #{?mouse,ON — tmux scrolls and selects,OFF — the browser selects; use its own copy and paste}"

# The toggle is useless if nobody knows it exists: lead the status line with which side owns the
# mouse and the key that flips it. Same fields as the stock status-right after that — appending
# instead would just be truncated, since status-right-length defaults to 40.
set -g status-right-length 80
set -g status-right "#[fg=colour245]#{?mouse,mouse:tmux,mouse:browser} ^b m#[default]  \"#{=21:pane_title}\" %H:%M %d-%b-%y"

# Emit OSC 52 on copy so a tmux-side selection reaches the browser clipboard. NOTE: xterm.js v6 ships
# no OSC 52 handler and oyren-ai-next registers none, so today this only reaches terminals that do
# (the editor's). It costs nothing and starts working the moment that handler lands.
set -g set-clipboard on

# Double-click grabs a whole path or URL rather than stopping at - _ @ /
set -g word-separators " "

# Paste tmux's own buffer bracketed, so a multi-line buffer lands as one paste in an app that asked
# for bracketed paste instead of being replayed line by line into a shell that runs each one.
bind ] paste-buffer -p

# ------------------------------------------------------------------ session environment
# Propagate GitHub tokens into existing sessions when a new client attaches.
# Without this, shells inside tmux lose GITHUB_TOKEN / GH_TOKEN if the container is restarted
# or if a new session is attached after the environment changed. The gh-wrapper fetches fresh
# tokens on every invocation (orchestrator callback), but having the env var current in the
# shell also helps tools that read it directly (e.g. GitHub Actions scripts, curl one-liners).
set -ga update-environment "GITHUB_TOKEN"
set -ga update-environment "GH_TOKEN"
