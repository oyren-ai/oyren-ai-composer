services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Must match the host bind path so sibling task containers resolve correctly.
      TASKS_DIR: /srv/script-runner/tasks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/script-runner/tasks:/srv/script-runner/tasks
    # Not published to the host; only Caddy is public.
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
