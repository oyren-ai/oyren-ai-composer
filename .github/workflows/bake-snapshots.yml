name: Bake snapshots

# Manual bake of the DigitalOcean sandbox snapshots on a GitHub-hosted runner — the bake only needs
# the DO API plus SSH to its own throwaway droplet (deploy/bake/*.sh). Composer's one-click
# replacement for running the bake scripts by hand.
#
# Three images; the two session images bake in PARALLEL off the same checkout:
#   base            bake_base             stock Ubuntu → full provisioning            every session
#   lean            bake_lean             lean FOUNDATION → the same provisioning     Lean sessions
#   leanfoundation  bake_lean_foundation  stock Ubuntu → oyren user + elan + Mathlib  only when deploy/lean/ changed
# The lean job builds from lean_foundation_id, else the foundation this run just baked, else the
# newest oyren-sandbox-leanfoundation-* in the account. The zed image IS the base image.
# Design: docs/plans/lean-foundation-bake.md.
#
# AFTER a run: point the orchestrator at the new ids (DROPLET_SNAPSHOT_ID + DROPLET_SNAPSHOT_ID_ZED
# = base, DROPLET_SNAPSHOT_ID_LEAN = lean) and redeploy it — that step is NOT automated here.

on:
  workflow_dispatch:
    inputs:
      bake_base:
        description: "Bake a new BASE snapshot (it is also the zed image)"
        type: boolean
        default: true
      bake_lean:
        description: "Bake a new LEAN snapshot (full provisioning on top of a lean foundation)"
        type: boolean
        default: false
      bake_lean_foundation:
        description: "First bake a new LEAN FOUNDATION (only when deploy/lean/ changed)"
        type: boolean
        default: false
      lean_foundation_id:
        description: "Lean-foundation image id to build the lean snapshot from (blank = this run's, else the newest in the account)"
        type: string
        default: ""
      region:
        description: "DigitalOcean region"
        type: string
        default: "fra1"

concurrency:
  group: bake-snapshots
  cancel-in-progress: false

permissions:
  contents: read

env:
  # DO_API_TOKEN is what the bake scripts read; the org secret is named DIGITALOCEAN_ACCESS_TOKEN.
  DO_API_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
  # The id/fingerprint of an SSH key uploaded to DO, so the throwaway droplets are reachable.
  DO_SSH_KEY_ID: ${{ secrets.DO_SSH_KEY_ID || vars.DO_SSH_KEY_ID }}
  DO_REGION: ${{ inputs.region }}

jobs:
  foundation:
    if: ${{ inputs.bake_lean_foundation }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      id: ${{ steps.bake.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bake-preflight
        with:
          ssh_private_key: ${{ secrets.BAKE_SSH_PRIVATE_KEY }}
      - name: Bake LEAN FOUNDATION snapshot
        id: bake
        run: |
          set -o pipefail
          bash deploy/bake/bake-lean-foundation.sh | tee /tmp/foundation.log
          id="$(grep -oiE 'image id: [0-9]+' /tmp/foundation.log | grep -oE '[0-9]+' | tail -1)"
          [ -n "$id" ] || { echo "::error::could not parse foundation image id from output"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  base:
    if: ${{ inputs.bake_base }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      id: ${{ steps.bake.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bake-preflight
        with:
          ssh_private_key: ${{ secrets.BAKE_SSH_PRIVATE_KEY }}
      - name: Bake BASE snapshot
        id: bake
        run: |
          set -o pipefail
          bash deploy/bake/bake-base-snapshot.sh | tee /tmp/base.log
          id="$(grep -oiE 'image id: [0-9]+' /tmp/base.log | grep -oE '[0-9]+' | tail -1)"
          [ -n "$id" ] || { echo "::error::could not parse base image id from output"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  lean:
    needs: foundation
    # Runs when asked, whether the foundation job ran (success) or was not requested (skipped).
    if: ${{ !cancelled() && inputs.bake_lean && (needs.foundation.result == 'success' || needs.foundation.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      id: ${{ steps.bake.outputs.id }}
      foundation: ${{ steps.resolve.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bake-preflight
        with:
          ssh_private_key: ${{ secrets.BAKE_SSH_PRIVATE_KEY }}
      - name: Resolve the lean foundation to build on
        id: resolve
        env:
          INPUT_ID: ${{ inputs.lean_foundation_id }}
          BAKED_ID: ${{ needs.foundation.outputs.id }}
        run: |
          id="${INPUT_ID:-$BAKED_ID}"
          if [ -z "$id" ]; then
            id="$(curl -fsS -H "Authorization: Bearer $DO_API_TOKEN" \
              'https://api.digitalocean.com/v2/snapshots?resource_type=droplet&per_page=200' \
              | jq -r '[.snapshots[] | select(.name | startswith("oyren-sandbox-leanfoundation-"))] | sort_by(.created_at) | last | .id // empty')"
          fi
          [ -n "$id" ] || { echo "::error::no lean foundation to build on — tick bake_lean_foundation or pass lean_foundation_id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "lean foundation: $id"
      - name: Bake LEAN snapshot (base provisioning on top of the foundation)
        id: bake
        env:
          BASE_IMAGE: ${{ steps.resolve.outputs.id }}
          VARIANT: lean
        run: |
          set -o pipefail
          bash deploy/bake/bake-base-snapshot.sh | tee /tmp/lean.log
          id="$(grep -oiE 'image id: [0-9]+' /tmp/lean.log | grep -oE '[0-9]+' | tail -1)"
          [ -n "$id" ] || { echo "::error::could not parse lean image id from output"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  summary:
    needs: [foundation, base, lean]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Bake results"
            echo ""
            echo "| Snapshot | Image id |"
            echo "|---|---|"
            echo "| base (= zed) | ${{ needs.base.outputs.id || '(not baked)' }} |"
            echo "| lean | ${{ needs.lean.outputs.id || '(not baked)' }} |"
            echo "| lean foundation | ${{ needs.foundation.outputs.id || needs.lean.outputs.foundation || '(not baked)' }} |"
            echo ""
            echo "### Next (manual — not automated)"
            echo "Point the orchestrator at the new images and redeploy it:"
            echo "- \`DROPLET_SNAPSHOT_ID\` and \`DROPLET_SNAPSHOT_ID_ZED\` = the **base** id"
            echo "- \`DROPLET_SNAPSHOT_ID_LEAN\` = the **lean** id"
          } >> "$GITHUB_STEP_SUMMARY"
