# Drop-in on oyren-sandbox.service (installed by deploy/sandbox-host/install-runtime.sh into
# /etc/systemd/system/oyren-sandbox.service.d/): the same cloud-init `systemctl start
# oyren-sandbox` that brings up the runtime also starts the tmux server, and starts it FIRST, so
# entrypoint.sh finds the socket and creates the agent session inside it.
#
# Wants=, never Requires=/PartOf=/BindsTo=: the whole point is that a runtime restart leaves the
# tmux server (and everything running in it) alone — see deploy/units/oyren-tmux.service.
[Unit]
Wants=oyren-tmux.service
After=oyren-tmux.service
