# Purely additive drop-in on the BASE image's oyren-sandbox.service, whose baked Wants= list cannot
# name oyren-zed without a base re-bake — this file exists only in the zed snapshot (installed by
# deploy/zed/install-zed.sh into /etc/systemd/system/oyren-sandbox.service.d/). systemd merges
# Wants= across drop-ins, so the same cloud-init `systemctl start oyren-sandbox` that brings up the
# editor also starts the zed stack.
#
# Wants=, never Requires=/PartOf=/BindsTo=: a runtime crash-restart must leave Zed alone (same
# reasoning as the editor), and a broken zed stack must never stop the session.
[Unit]
Wants=oyren-zed.service
