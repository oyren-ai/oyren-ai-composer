#cloud-config
# Cloud-init configuration for Oyren Composer server

hostname: ${hostname}

# Update packages on first boot
package_update: true
package_upgrade: true

# Install required packages
packages:
  - docker.io
  - docker-compose
  - git
  - curl
  - wget
  - htop
  - ufw
  - fail2ban

# Create oyren user
users:
  - name: oyren
    groups: docker, sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

# Configure Docker
runcmd:
  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Configure firewall
  - ufw --force enable
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp

  # Configure fail2ban for SSH protection
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Set timezone
  - timedatectl set-timezone UTC

  # Create application directory
  - mkdir -p /srv/script-runner
  - chown -R oyren:oyren /srv/script-runner

  # Log completion
  - echo "Cloud-init setup completed at $(date)" >> /var/log/cloud-init-complete.log

# Write files
write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
      findtime = 600

  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

# Reboot after setup (optional, commented out for faster provisioning)
# power_state:
#   mode: reboot
#   message: Rebooting after cloud-init setup
#   timeout: 30
